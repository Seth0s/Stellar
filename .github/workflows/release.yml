name: Release

# DESIGN-BACKLOG.md item 18 — builds packages for Linux (.rpm + .deb),
# macOS (.dmg + .zip) and Windows (.nsis installer + portable) and
# publishes them (plus auto-updater metadata) to a GitHub Release
# whenever a `v*` tag is pushed. `electron-updater`'s feed
# (registerUpdater, main/updater.ts) reads exactly this: a GitHub
# Release with the platform artifacts and the per-platform
# `latest*.yml` electron-builder generates alongside them.
#
# `.rpm` (Fedora) is the one platform explicitly required by the user —
# it's its own job, not one leg of a matrix, so a macOS/Windows failure
# can never block or cancel it (matrix `fail-fast` would do exactly
# that; separate jobs don't).
#
# QUEM CRIA A RELEASE: um job só, ANTES dos builds (`prepare-release`).
#
# Achado ao vivo (2026-08-31, releases v0.1.5/v0.1.6/v0.2.0 todas com o
# mesmo sintoma): os 3 jobs de build rodavam em paralelo e cada um
# chamava `electron-builder --publish always`, que checa "a release da
# tag já existe?" e cria se não — sem NENHUMA sincronização entre eles,
# dois ou três jobs viam "não existe" ao mesmo tempo e cada um criava a
# SUA própria release pra mesma tag, resultando em duas releases
# "gêmeas" com os assets espalhados entre elas (o .rpm, por exemplo,
# ficava só na release que `gh release view` não resolve por padrão —
# parecia ter sumido, mas só estava na gêmea).
#
# A primeira correção (2026-09) tirou a criação dos builds e pôs num job
# `publish` DEPOIS deles, consolidando via artifact storage do Actions.
# Matou o race, e criou outro problema: cada release gravava os binários
# DUAS vezes — uma no artifact storage (cota apertada) e outra na
# Release (que não conta pra essa cota). O storage nunca era limpo.
#
# Medido em 2026-09-14, no release da v0.8.0: `Failed to CreateArtifact:
# Artifact storage quota has been hit` no job do macOS. O build tinha
# PASSADO; só o upload falhou, e sem os artifacts o `publish` não tinha
# o que publicar. Havia 3,47 GB em 15 artifacts de 5 releases antigas,
# contra os 500 MB do plano — e um release sozinho ocupa ~746 MB (mac
# 335 + linux 269 + win 142), então nem `retention-days: 1` caberia.
#
# Desenho atual, que mantém o race morto SEM usar artifact storage:
# `prepare-release` cria a Release da tag uma vez (um chamador só, antes
# de todo mundo), e cada build faz `gh release upload --clobber` dos
# SEUS arquivos direto. Ninguém mais cria, então não há gêmea possível;
# ninguém passa pelo artifact storage, então não há cota pra estourar.
# A independência entre plataformas melhora de tabela: cada job publica
# o que conseguiu, sem esperar os outros dois nem depender de um job
# final que só roda se algo sobreviveu.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Único criador da Release — roda antes de tudo, então os três builds
  # encontram a Release já existente e só fazem upload. É isto que
  # impede as releases gêmeas descritas no cabeçalho.
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: cria a Release da tag se ainda não existir
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME já existe — nada a criar."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  build-linux:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # electron-builder's rpm/deb targets shell out to `fpm`, which
      # needs a real `rpmbuild` on PATH for `.rpm` — not present on
      # ubuntu-latest by default. build-essential/python3 cover
      # node-gyp for the native deps (better-sqlite3, node-pty) that
      # `npm ci`'s own postinstall (electron-rebuild) compiles against
      # the pinned Electron version.
      - run: sudo apt-get update && sudo apt-get install -y rpm build-essential python3

      - run: npm ci

      - run: npx tsc --noEmit

      # Electron smoke is local-only (`npm run verify`). Declared in
      # ci.yml — the xvfb job was red on every run since before
      # 2026-08-31 because the app never comes up on GitHub-hosted
      # runners. Do not re-add xvfb-run here until a scripted boot is
      # demonstrated. This job's gate is tsc + the package build.
      - run: npm run build

      # `--publish never` — build only, no network call to the Releases
      # API here (see the file-level comment on why). The `latest*.yml`
      # auto-update feed files are still generated locally regardless of
      # `--publish`, so they ship in the artifact too.
      - name: Build .rpm and .deb
        run: npx electron-builder --linux rpm deb --publish never

      - name: publica os artefatos Linux na Release da tag
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          FILES=$(ls -1 dist/*.rpm dist/*.deb dist/*.blockmap dist/latest-linux.yml 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "::error::nenhum artefato gerado neste job"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" $FILES --repo "$GITHUB_REPOSITORY" --clobber

  build-mac:
    needs: prepare-release
    runs-on: macos-latest
    # Never blocks/gets blocked by build-linux — see the note at the top
    # of this file. No macOS/Windows signing yet (DESIGN-BACKLOG.md item
    # 13/docs/packaging.md §4, deliberately deferred, same call
    # CentralByte made) — these artifacts will trigger Gatekeeper on
    # first launch until that's done.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Build macOS artifacts
        run: npx electron-builder --mac --publish never
      - name: publica os artefatos macOS na Release da tag
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          FILES=$(ls -1 dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "::error::nenhum artefato gerado neste job"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" $FILES --repo "$GITHUB_REPOSITORY" --clobber

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    # Same independence note as build-mac above; no code signing yet
    # (SmartScreen will warn on first run until docs/packaging.md §4 is
    # done).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Build Windows artifacts
        run: npx electron-builder --win --publish never
      - name: publica os artefatos Windows na Release da tag
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          FILES=$(ls -1 dist/*.exe dist/*.blockmap dist/latest.yml 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "::error::nenhum artefato gerado neste job"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" $FILES --repo "$GITHUB_REPOSITORY" --clobber

  # Fecha o release dizendo o que de fato chegou na Release. Não publica
  # nada — cada build já publicou o seu — então não pode criar gêmea nem
  # depender de artifact storage. `if: always()` mantém a independência:
  # roda mesmo com uma plataforma quebrada, e o resumo diz qual faltou.
  summary:
    name: resumo do que foi publicado
    needs: [build-linux, build-mac, build-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: lista os assets da Release da tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ASSETS=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' || true)
          if [ -z "$ASSETS" ]; then
            echo "::error::a Release $GITHUB_REF_NAME não tem nenhum asset — os três builds falharam"
            exit 1
          fi
          echo "Assets publicados em $GITHUB_REF_NAME:"
          echo "$ASSETS" | sed 's/^/  /'
          for want in rpm deb dmg exe; do
            echo "$ASSETS" | grep -q "\.$want" || echo "::warning::nenhum .$want nesta Release (build da plataforma falhou)"
          done
