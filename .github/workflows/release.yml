name: Release

# Fazenda de build dos pacotes do Stellar.
#
# TOPOLOGIA:
#   Um push de tag `v*` builda nos três SOs (GitHub é a única fonte grátis de
#   runner macOS e Windows) e anexa os pacotes à Release da própria tag.
#
# POR QUE GITHUB RELEASE (e não mais rsync para a VPS):
#   O desenho anterior mandava tudo por rsync-over-ssh para /srv/stellar/download
#   porque duas alternativas tinham morrido: a GitHub Release saiu junto com o
#   GitHub deixando de ser fonte da verdade, e `actions/upload-artifact` quebrou
#   por cota — um release ocupa ~746 MB (mac 335 + linux 269 + win 142) contra os
#   500 MB do plano.
#
#   Essa segunda razão não se aplicava a Releases. A cota de storage do Actions
#   cobre workflow artifacts, Packages e cache; asset de Release não entra nela.
#   A documentação é explícita: "no limit on the total size of a release, nor
#   bandwidth usage" — o limite é 2 GiB por arquivo e 1000 assets por release.
#   Com o repositório público, os runners padrão também passam a ser grátis.
#
#   Resultado: quem abre o repositório baixa o app da própria Release, sem
#   depender da VPS estar de pé nem de chave SSH nenhuma.
#
# ATOMICIDADE (o que o symlink `latest` fazia antes):
#   `prepare` cria a Release como DRAFT. Draft não aparece para o público e não
#   vira `latest`. Cada build anexa o seu pacote ao draft. Só o job `publish`,
#   que depende dos TRÊS builds, confere que os cinco formatos chegaram e tira o
#   draft. Se qualquer SO falhar, o draft fica lá, invisível, e a release
#   anterior continua sendo a `latest` — mesma garantia do `mv -T` de antes.
#
# SEGREDOS: nenhum. O GITHUB_TOKEN do próprio run tem o `contents: write`
#   declarado abaixo, que é tudo de que este workflow precisa.

on:
  push:
    tags:
      - "v*"

# Escreve na Release da tag — e nada além disso.
permissions:
  contents: write

# Duas tags próximas não se atropelam.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------
  # prepare: deriva/valida a versão e CRIA o diretório remoto da versão.
  # Os três jobs de build declaram `needs: prepare` (não só o Linux): sem
  # isso macOS e Windows começariam a subir antes de o destino existir.
  # ---------------------------------------------------------------------
  prepare:
    name: prepare (versão + destino)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: deriva a versão da tag e confere contra o package.json
        id: version
        run: |
          set -euo pipefail
          ref="$GITHUB_REF_NAME"
          case "$ref" in
            v*) version="${ref#v}" ;;
            *) echo "::error::tag '$ref' não começa com 'v'"; exit 1 ;;
          esac
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::versão '$version' não é semver (esperado X.Y.Z, opcional -sufixo)"
            exit 1
          fi
          # O nome do artefato é montado com a versão do package.json
          # (artifactName "${productName}-${version}-${arch}.${ext}"), então
          # tag e package.json divergentes gerariam um diretório cujo nome não
          # bate com o conteúdo. Falha cedo, antes de buildar nada.
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$version" ]; then
            echo "::error::tag v$version não bate com package.json ($pkg). Alinhe os dois antes de taguear."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versão de release: $version"

      - name: cria a Release da tag como draft (invisível até os três SOs chegarem)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe — reaproveitando."
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
            echo "Release $TAG criada como draft."
          fi

          # A LISTA DE COMMITS NO CORPO DA RELEASE (task 5fb0c21b, item 4).
          #
          # POR QUE AQUI E NÃO EM RUNTIME: o app lê esta lista do corpo da
          # release, que já chega no `releaseNotes` do electron-updater — a API
          # do GitHub tem 60 req/h sem token e o app não embute token nenhum.
          #
          # POR QUE NÃO BASTA O `--generate-notes`: medido na v0.8.2, ele
          # entrega SÓ `**Full Changelog**: .../compare/v0.8.1...v0.8.2`. A nota
          # gerada é mantida (é útil), e a lista entra DEPOIS, entre marcadores
          # de formato fixo: `<!-- stellar:commits -->` … `<!-- /stellar:commits -->`
          # (`src/shared/release-notes.ts` é o parser, e o teste dele é a prova).
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          gh release view "$TAG" --json body --jq .body > /tmp/stellar-release-body.md
          # Idempotente: uma seção de uma rodada anterior sai antes de entrar a nova.
          sed -i '/<!-- stellar:commits -->/,/<!-- \/stellar:commits -->/d' /tmp/stellar-release-body.md
          {
            echo ""
            echo "<!-- stellar:commits -->"
            echo "### Commits"
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty=format:'- %h %s' "${PREV_TAG}..${TAG}"
            else
              echo "- (primeira release — sem tag anterior para comparar)"
            fi
            echo ""
            echo "<!-- /stellar:commits -->"
          } >> /tmp/stellar-release-body.md
          gh release edit "$TAG" --notes-file /tmp/stellar-release-body.md
          echo "Release $TAG: lista de commits (${PREV_TAG:-<nenhuma>}..$TAG) escrita no corpo."

  # ---------------------------------------------------------------------
  # build-linux: .deb, .rpm e AppImage.
  #   - `.rpm` exige rpmbuild; `fpm` (usado por rpm/deb) é baixado pelo
  #     electron-builder. build-essential/python3 cobrem o node-gyp dos
  #     nativos (better-sqlite3, node-pty) no `npm ci`.
  #   - AppImage não está no package.json (território desta tarefa não o
  #     inclui), então é pedido no CLI. Ele é também o alvo que faz o
  #     electron-builder emitir latest-linux.yml.
  # ---------------------------------------------------------------------
  build-linux:
    name: build linux (.deb .rpm AppImage)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: sudo apt-get update && sudo apt-get install -y rpm build-essential python3

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run build

      - name: gera .deb, .rpm e AppImage (sem publicar em lugar nenhum)
        run: npx electron-builder --linux deb rpm AppImage --publish never

      - name: confere que os três formatos existiram
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for ext in deb rpm AppImage; do
            files=(dist/*."$ext")
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::nenhum pacote .$ext foi gerado"
              exit 1
            fi
            echo ".$ext -> ${files[*]}"
          done

      - name: anexa os pacotes Linux ao draft da Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.deb dist/*.rpm dist/*.AppImage dist/*.blockmap dist/latest-linux.yml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::o build não gerou nenhum artefato Linux"
            exit 1
          fi
          echo "Anexando a $TAG: ${files[*]}"
          gh release upload "$TAG" "${files[@]}" --clobber

  # ---------------------------------------------------------------------
  # build-mac: .dmg (+ .zip, que é o que o electron-updater usa no mac).
  #   needs: prepare — obrigatório, ver comentário no topo do job prepare.
  #   Sem assinatura/notarização: decisão registrada (docs/packaging.md §4).
  # ---------------------------------------------------------------------
  build-mac:
    name: build macOS (.dmg)
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      # Sem identidade de assinatura no runner; evita o electron-builder
      # gastar tempo procurando uma no keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: gera o .dmg (e o .zip) sem publicar
        run: npx electron-builder --mac --publish never

      - name: confere que o .dmg existiu
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.dmg)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::nenhum .dmg foi gerado"
            exit 1
          fi
          echo ".dmg -> ${files[*]}"

      - name: anexa os pacotes macOS ao draft da Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::o build não gerou nenhum artefato macOS"
            exit 1
          fi
          echo "Anexando a $TAG: ${files[*]}"
          gh release upload "$TAG" "${files[@]}" --clobber

  # ---------------------------------------------------------------------
  # build-windows: instalador NSIS (.exe) + portable (.exe).
  #   O `gh` já vem na imagem windows-latest, então o upload aqui é o mesmo
  #   dos outros dois SOs — não é mais preciso o MSYS2 que existia só para
  #   arranjar rsync/openssh nesta plataforma.
  # ---------------------------------------------------------------------
  build-windows:
    name: build windows (.exe)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: gera o instalador e o portable (.exe) sem publicar
        run: npx electron-builder --win --publish never

      - name: confere que o .exe existiu
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.exe)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::nenhum .exe foi gerado"
            exit 1
          fi
          echo ".exe -> ${files[*]}"

      - name: anexa os pacotes Windows ao draft da Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.exe dist/*.blockmap dist/latest.yml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::o build não gerou nenhum artefato Windows"
            exit 1
          fi
          echo "Anexando a $TAG: ${files[*]}"
          gh release upload "$TAG" "${files[@]}" --clobber

  # ---------------------------------------------------------------------
  # publish: depende dos TRÊS builds. Sem `if: always()` de propósito — se
  # qualquer plataforma falhar, este job é pulado, o draft nunca é publicado e
  # a release anterior continua sendo a `latest`.
  # ---------------------------------------------------------------------
  publish:
    name: publish (tira o draft)
    needs: [build-linux, build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: confere os cinco formatos e publica
        env:
          GH_TOKEN: ${{ github.token }}
          # Este job não faz checkout — não precisa da árvore. Sem ela o `gh`
          # não tem git remote de onde inferir o repositório e morre com
          # "not a git repository"; GH_REPO diz qual é, sem clonar nada.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # 1) Os cinco formatos precisam estar anexados e não-vazios.
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"' > assets.tsv
          echo "Assets anexados:"
          cat assets.tsv

          for ext in deb rpm AppImage dmg exe; do
            if ! cut -f1 assets.tsv | grep -q "\.$ext$"; then
              echo "::error::faltando pacote .$ext na release $TAG"
              exit 1
            fi
          done

          if awk -F'\t' '$2 == 0 { print; found = 1 } END { exit !found }' assets.tsv; then
            echo "::error::há asset de tamanho zero na release $TAG"
            exit 1
          fi

          # 2) Só agora a release deixa de ser draft — nunca antes dos arquivos.
          gh release edit "$TAG" --draft=false --latest
          echo "Release $TAG publicada."
