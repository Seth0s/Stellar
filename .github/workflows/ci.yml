name: CI

# Honest cut (2026-09-12, task c78ab226):
#
# This workflow answers "is this commit type-sound, do the unit tests
# pass, and does it build?" It does NOT run the Electron smoke suite.
#
# RUNS HERE (must stay green):
#   tsc --noEmit, eslint, vitest, check:tokens, electron-vite build
#
# DOES NOT RUN HERE:
#   1. scripts/verify/smoke-*.mjs — need a real Electron window. Every
#      xvfb job since before 2026-08-31 has been red because the app
#      never answers CDP in time on GitHub-hosted runners (see
#      cdp-client.mjs startApp: "app didn't come up on port … within
#      15000ms"). A permanently-red job trains everyone to ignore red,
#      which is worse than not having the job. Local: `npm run verify`.
#      Re-add a CI job only after someone demonstrates a scripted boot
#      on xvfb.
# `release.yml` still owns packaging. This file only answers "is the
# commit sane?"
on:
  push:
    branches: ["**"]
  pull_request:

# A push on top of another on the same branch cancels the previous run —
# what matters is the current branch state, not the whole queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tsc + unit + tokens + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs postinstall (electron-rebuild), which compiles
      # better-sqlite3 and node-pty against the pinned Electron ABI —
      # node-gyp needs build-essential/python3, same reason documented
      # in release.yml.
      - run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: eslint
        run: npm run lint

      - name: vitest (unit + dom)
        run: npm run test:unit

      - name: design tokens (SYSTEM_DESIGN §1)
        run: npm run check:tokens

      - run: npm run build

  # Visible in the Actions UI so the skip is declared, not silent.
  # This job always succeeds. It must never grow a `xvfb-run` step
  # until a scripted Electron boot on the runner is demonstrated.
  smoke:
    name: smoke (local only — not run on CI)
    runs-on: ubuntu-latest
    steps:
      - name: declared skip
        run: |
          echo "::notice::Electron smoke is not run on GitHub-hosted runners."
          echo "Reason: the app has never come up under xvfb here (red since before 2026-08-31)."
          echo "Local: npm run verify   (or npm run verify:smoke after a build)"
          echo "Re-add this job only after a scripted xvfb boot is demonstrated."
