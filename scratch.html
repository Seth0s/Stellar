<!DOCTYPE html>
<html>
<head>
<style>
.modal { max-width: 560px; padding: 20px; background: #eee; border: 1px solid #ccc; font-family: sans-serif; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
.row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
kbd { flex: none; display: inline-block; padding: 2px 6px; font-family: monospace; font-size: 11px; background: white; border: 1px solid black; }
</style>
</head>
<body>
<div class="modal">
  <div class="grid">
    <div class="group">
      <div class="row">
        <kbd>Ctrl+Plus (ou Ctrl+=, Ctrl+Numpad +)</kbd>
        <span>zoom do canvas (in) — via tecla, além do scroll</span>
      </div>
    </div>
    <div class="group">
      <div class="row">
        <kbd>Ctrl+D</kbd>
        <span>duplica o card no topo</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
