<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 64 64">
  <!-- Small-size app icon (16, 24, 32 px): the dark rounded square, a thicker frame and a
       larger central star with the logo gradients. The constellations and the tiny stars are
       dropped — below ~32 px they turn into noise. Same variant as StellarMark at <= 24 px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f2a" />
      <stop offset="1" stop-color="#10131a" />
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d6bff" />
      <stop offset="0.55" stop-color="#9c8cff" />
      <stop offset="1" stop-color="#c46cf0" />
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9d6ff" />
      <stop offset="0.5" stop-color="#8fa2ff" />
      <stop offset="1" stop-color="#c39cff" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)" />
  <rect x="6.5" y="6.5" width="51" height="51" rx="12" fill="none" stroke="url(#frame)" stroke-width="4.5" />
  <path d="M32 14c1.5 14.5 5.5 18.5 18 18-12.5.5-16.5 4.5-18 18-1.5-13.5-5.5-17.5-18-18 12.5-.5 16.5-4.5 18-18z" fill="url(#star)" />
</svg>
