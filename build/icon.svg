<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon: the approved Stellar logo (same artwork as src/renderer/src/StellarMark.tsx,
       full variant) on its own dark rounded square, so it reads on a dock, a taskbar
       and a light or dark menu. build/icon-small.svg is the variant for 16-32 px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f2a" />
      <stop offset="1" stop-color="#10131a" />
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d6bff" />
      <stop offset="0.55" stop-color="#9c8cff" />
      <stop offset="1" stop-color="#c46cf0" />
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9d6ff" />
      <stop offset="0.5" stop-color="#8fa2ff" />
      <stop offset="1" stop-color="#c39cff" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)" />

  <!-- the logo's 64x64 grid, scaled to 845 px and centred -->
  <g transform="translate(89.6 89.6) scale(13.2)">
    <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="none" stroke="url(#frame)" stroke-width="2.4" />
    <circle cx="17.5" cy="11.5" r="0.8" fill="#fff1d0" />
    <circle cx="52.5" cy="15" r="0.8" fill="#fff1d0" />
    <circle cx="49" cy="50.5" r="0.8" fill="#fff1d0" />
    <path d="M23.5 12.6A3.4 3.4 0 1 0 26.33 17.89A3 3 0 0 1 23.5 12.6z" fill="#8fa8ff" />
    <path d="M19.6 19.2 13.8 25l4.6 10.7L25 41.5" fill="none" stroke="#8fa2ff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <path d="M42.1 20.9l9.2 5.1 1 7.9-6.9 6.7" fill="none" stroke="#b48cfb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <circle cx="13.8" cy="25" r="1.9" fill="#a9dcff" />
    <circle cx="18.4" cy="35.7" r="1.4" fill="#a9c8ff" />
    <circle cx="25" cy="41.5" r="1.2" fill="#b9a4ff" />
    <circle cx="42.1" cy="20.9" r="1.3" fill="#c9b4ff" />
    <circle cx="51.3" cy="26" r="1.8" fill="#c39cff" />
    <circle cx="52.3" cy="33.9" r="1.4" fill="#c39cff" />
    <circle cx="45.4" cy="40.6" r="1.3" fill="#c39cff" />
    <path d="M32.5 18c.9 9.1 3.3 11.6 12.5 12.5-9.2.9-11.6 3.4-12.5 12.5-.9-9.1-3.3-11.6-12.5-12.5 9.2-.9 11.6-3.4 12.5-12.5z" fill="url(#star)" />
  </g>
</svg>
